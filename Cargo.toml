[package]
name = "chimera"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
libc = "0.2.190"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
