name: Release

# Push a tag like `v0.1.1` (matching `version` in Cargo.toml) to build binaries, create the
# GitHub Release and publish the crate. See docs/PUBLISHING.md.
on:
  push:
    tags: ["v*"]
  # Manual run: checks and builds the binaries only (no release, no publish).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: version
        name: Tag must match Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binaries that run on any Linux distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="chimera-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/chimera" README.md LICENSE chimera.example.yaml "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chimera-${{ matrix.target }}
          path: chimera-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [check, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # Safe to re-run: if the release already exists (a re-run after a later job failed), the
      # binaries and notes are replaced instead of failing on "release already exists".
      - name: Create or update the release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} /^\[[^]]+\]: /{p = 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Chimera $VERSION" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Chimera $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Chimera $VERSION" --notes-file notes.md --verify-tag
          fi

  crates-io:
    name: Publish to crates.io
    needs: [check, github-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Requires a reviewer's approval (configured on the `release` environment in GitHub).
    environment: release
    permissions:
      id-token: write # trusted publishing: no API token is stored in GitHub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Skip if this version is already on crates.io
        id: exists
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 \
            -A "chimera-release (github.com/l0ngsight/chimera)" \
            "https://crates.io/api/v1/crates/chimera-ai/$VERSION")
          # Only a definite answer decides: 200 is published, 404 is not. Anything else (rate
          # limit, outage) stops the job so it can be re-run, rather than guessing.
          case "$status" in
            200) published=true ;;
            404) published=false ;;
            *) echo "::error::crates.io answered HTTP $status; re-run this job later"; exit 1 ;;
          esac
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - if: steps.exists.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
